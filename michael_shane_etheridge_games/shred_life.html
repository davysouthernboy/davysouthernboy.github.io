/* Layout: one centered 16:9 stage, overlay menus on top, touch controls and key hints beneath. Dusk plaza palette. */

* { box-sizing: border-box; }
body {

button:hover { background: var(--sun); }

  // Zones ('ice', 'belt') take [type, clearance, width, dir, overlap]; with overlap the cursor moves only by the clearance,

  function seq(start, items) {
